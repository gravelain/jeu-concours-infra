services:
  app:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    container_name: backend_prod
    environment:
      - APP_ENV=prod
      - DATABASE_URL=mysql://prod_user:prod_password@db_prod:3306/ThetipDatabase
    volumes:
      - ../../backend:/var/www/html
    ports:
      - "9002:9000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: prod_root
      MYSQL_DATABASE: ThetipDatabase
      MYSQL_USER: prod_user
      MYSQL_PASSWORD: prod_password
    ports:
      - "3309:3306"
    volumes:
      - db_data_prod:/var/lib/mysql

volumes:
  db_data_prod: