services:
  app:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    container_name: backend_preprod
    environment:
      - APP_ENV=preprod
      - DATABASE_URL=mysql://preprod_user:preprod_password@db_preprod:3306/ThetipDatabase
    volumes:
      - ../../backend:/var/www/html
    ports:
      - "9001:9000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: db_preprod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: preprod_root
      MYSQL_DATABASE: ThetipDatabase
      MYSQL_USER: preprod_user
      MYSQL_PASSWORD: preprod_password
    ports:
      - "3308:3306"
    volumes:
      - db_data_preprod:/var/lib/mysql

volumes:
  db_data_preprod: