services:
  app:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    container_name: backend_dev
    environment:
      - APP_ENV=dev
      - DATABASE_URL=mysql://user_dev:Groupe6@db_dev:3306/Thetiptop_dev
    volumes:
      - ../../backend:/var/www/html
    ports:
      - "9000:9000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: db_dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Thetiptop_dev
      MYSQL_USER: user_dev
      MYSQL_PASSWORD: Groupe6
    ports:
      - "3307:3306"
    volumes:
      - db_data_dev:/var/lib/mysql

volumes:
  db_data_dev: